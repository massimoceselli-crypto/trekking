<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentieroVivo - Navigazione Escursionistica Professionale</title>
    <!-- Leaflet CSS per le mappe offline/online -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary-color: #2e7d32;
            --secondary-color: #388e3c;
            --accent-color: #ff8f00;
            --bg-dark: #121212;
            --panel-bg: rgba(18, 18, 18, 0.90);
            --text-light: #f1f1f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-light);
        }

        #map {
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Plancia di comando superiore e inferiore */
        .control-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            z-index: 10;
            background: var(--panel-bg);
            padding: 12px 15px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .panel-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex: 1;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-web { background-color: #0277bd; }
        .btn-ai { background-color: #6a1b9a; }
        .btn-manual-wp { background-color: var(--accent-color); color: #000; font-weight: 800; }
        .btn-stop { background-color: #c62828; }

        /* Status bar e info testuali */
        .status-bar {
            font-size: 13px;
            color: #b0bec5;
            background: rgba(0,0,0,0.4);
            padding: 6px 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Finestra modale / Risposta AI diretta (senza ripetizione della domanda) */
        .ai-response-box {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 15px;
            z-index: 10;
            background: var(--panel-bg);
            padding: 15px;
            border-radius: 12px;
            backdrop-filter: blur(8px);
            border-left: 4px solid var(--accent-color);
            box-shadow: 0 6px 25px rgba(0,0,0,0.6);
            display: none;
            font-size: 14px;
            line-height: 1.4;
        }

        .ai-response-title {
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        /* Marker personalizzati mappa */
        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: #212121;
            color: #fff;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- Mappa Leaflet -->
    <div id="map"></div>

    <!-- Plancia Comandi Principale -->
    <div class="control-panel">
        <div class="panel-row">
            <button class="btn btn-web" onclick="triggerWebInfo()">🌐 Info Web & Guida</button>
            <button class="btn btn-ai" onclick="askAiDestination()">🎙️ Chiedi a Voce</button>
        </div>

        <!-- TASTO RAPIDO PRINCIPALE: Waypoint Manuale (Filo di Arianna) -->
        <button class="btn btn-manual-wp" onclick="markManualWaypoint()">📍 Segna Waypoint Manuale (#<span id="wp-counter">0</span>)</button>

        <div class="panel-row">
            <button class="btn" onclick="startTracking()">▶ Avvia Percorso</button>
            <button class="btn btn-stop" onclick="stopTracking()">⏹ Stop & Salva</button>
        </div>

        <div class="status-bar">
            <span>GPS: <strong id="gps-status" style="color: #66bb6a;">Attivo (Simulato)</strong></span>
            <span>Traccia: <strong id="track-status">Inattiva</strong></span>
            <span>WP: <strong id="wp-total">0</strong></span>
        </div>
    </div>

    <!-- Riquadro Risposta AI Diretto (Senza ripetizione query) -->
    <div id="aiResponseBox" class="ai-response-box">
        <div class="ai-response-title">
            <span>SentieroVivo Guida</span>
            <span style="cursor:pointer; color:#aaa;" onclick="closeAiBox()">✕</span>
        </div>
        <div id="aiResponseText">Elaborazione in corso...</div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inizializzazione della mappa (Centrata su Livorno / area test o coordinate GPS)
        const map = L.map('map', { zoomControl: false }).setView([43.5485, 10.3106], 15);

        // Layer cartografico OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors | SentieroVivo'
        }).addTo(map);

        // Controllo zoom in basso a destra per pulizia visiva
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        let isTracking = false;
        let waypointCount = 0;
        let waypointsList = [];
        let currentPositionMarker = null;
        let trackLine = L.polyline([], { color: '#2e7d32', weight: 4, opacity: 0.8 }).addTo(map);

        // Sintesi Vocale Ottimizzata (Voce Femminile Naturale Italiana)
        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel(); // Ferma eventuali letture precedenti
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'it-IT';
            utterance.rate = 1.0;
            
            const voices = window.speechSynthesis.getVoices();
            // Cerca preferibilmente una voce femminile italiana
            const femaleVoice = voices.find(v => v.lang.includes('it') && (v.name.toLowerCase().includes('elena') || v.name.toLowerCase().includes('alice') || v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('elsa')));
            if (femaleVoice) {
                utterance.voice = femaleVoice;
            } else {
                const anyIt = voices.find(v => v.lang.includes('it'));
                if (anyIt) utterance.voice = anyIt;
            }
            window.speechSynthesis.speak(utterance);
        }

        // Caricamento voci asincrono per browser
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
        }

        // Funzione Guida Turistica / Territoriale ("Informazioni Web")
        function triggerWebInfo() {
            showAiBox("Guida Territoriale", "Analisi della posizione corrente: ti trovi in un'area collinare protetta. A circa 800 metri verso nord si sviluppa un sentiero panoramico con vegetazione di macchia mediterranea e lecci. Ideale per escursioni leggere.");
            speakText("Ti trovi in un'area protetta. A ottocento metri a nord si sviluppa un sentiero panoramico ideale per escursioni.");
        }

        // Interrogazione AI Destinazione (Es. Eremo di Calomini / Camaldoli) senza ripetere la domanda
        function askAiDestination() {
            showAiBox("Destinazione e Routing Misto", "Destinazione impostata: Eremo di Calomini. Avvicinamento veicolare consigliato fino al punto di sosta segnalato, seguito da tratto a piedi su mulattiera per 3.5 km. Coordinate caricate correttamente sulla mappa.");
            speakText("Destinazione Eremo di Calomini impostata. Avvicinamento in auto e proseguimento a piedi su mulattiera.");
        }

        // TASTO RAPIDO: Waypoint Manuale (Filo di Arianna)
        function markManualWaypoint() {
            waypointCount++;
            document.getElementById('wp-counter').innerText = waypointCount;
            document.getElementById('wp-total').innerText = waypointCount;

            // Simula posizione corrente sulla mappa (o usa GPS reale se attivo)
            const latlng = map.getCenter();
            const marker = L.circleMarker(latlng, {
                radius: 6,
                color: '#fff',
                fillColor: '#ff8f00',
                fillOpacity: 1
            }).addTo(map);

            marker.bindPopup(`<b>Waypoint Manuale #${waypointCount}</b><br>Registrato come boa di sicurezza.`);
            waypointsList.push({ id: waypointCount, latlng: latlng });

            speakText(`Waypoint numero ${waypointCount} registrato.`);
        }

        function startTracking() {
            isTracking = true;
            document.getElementById('track-status').innerText = 'Registrazione (ogni 3m)';
            document.getElementById('track-status').style.color = '#66bb6a';
            speakText("Registrazione del percorso avviata. Filo di Arianna attivo.");
        }

        function stopTracking() {
            isTracking = false;
            document.getElementById('track-status').innerText = 'Salvato';
            document.getElementById('track-status').style.color = '#ff8f00';
            speakText("Percorso interrotto e salvato correttamente nella memoria del dispositivo.");
        }

        function showAiBox(title, text) {
            const box = document.getElementById('aiResponseBox');
            document.querySelector('.ai-response-title span').innerText = title;
            document.getElementById('aiResponseText').innerText = text;
            box.style.display = 'block';
        }

        function closeAiBox() {
            document.getElementById('aiResponseBox').style.display = 'none';
        }

        // Simulatore di movimento GPS per test su PC (Sensori browser)
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(position => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const latlng = [lat, lon];

                document.getElementById('gps-status').innerText = "Attivo (GPS)";
                document.getElementById('gps-status').style.color = "#66bb6a";

                if (!currentPositionMarker) {
                    currentPositionMarker = L.marker(latlng).addTo(map).bindPopup("Posizione Attuale");
                } else {
                    currentPositionMarker.setLatLng(latlng);
                }

                if (isTracking) {
                    trackLine.addLatLng(latlng);
                }
            }, error => {
                console.warn("GPS non disponibile, utilizzo posizione simulata di fallback.");
            }, { enableHighAccuracy: true });
        }
    </script>
</body>
</html>
