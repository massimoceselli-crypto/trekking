<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentieroVivo - Navigazione Escursionistica Professionale</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary-color: #2e7d32;
            --accent-color: #ff8f00;
            --menu-color: #00838f;
            --web-color: #0277bd;
            --bg-dark: #121212;
            --panel-bg: rgba(18, 18, 18, 0.96);
            --text-light: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-light);
        }

        #map {
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Plancia essenziale in BASSO: tasti compatti, testi chiari e leggibili */
        .control-panel {
            position: absolute;
            bottom: 15px;
            left: 10px;
            right: 10px;
            z-index: 10;
            background: var(--panel-bg);
            padding: 10px 12px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 -4px 25px rgba(0,0,0,0.7);
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .panel-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 8px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            flex: 1;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-web { background-color: var(--web-color); }
        .btn-menu { background-color: var(--menu-color); }
        .btn-manual-wp { 
            background-color: var(--accent-color); 
            color: #000; 
            font-weight: 800; 
            flex: 1.2; 
            font-size: 14px;
        }

        /* Status bar essenziale */
        .status-bar {
            font-size: 12px;
            color: #cfd8dc;
            background: rgba(0,0,0,0.5);
            padding: 4px 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 600;
        }

        /* Modale per Guide e Menu */
        .modal-box {
            position: absolute;
            top: 15px;
            left: 10px;
            right: 10px;
            z-index: 20;
            background: var(--panel-bg);
            padding: 16px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border-left: 5px solid var(--accent-color);
            box-shadow: 0 6px 25px rgba(0,0,0,0.8);
            display: none;
            font-size: 15px;
            line-height: 1.5;
            max-height: 75vh;
            overflow-y: auto;
        }

        .modal-title {
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 17px;
        }

        /* Campi di input personalizzati per il salvataggio file */
        .input-group {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-group label {
            font-size: 13px;
            color: #b0bec5;
        }

        .input-group input, .input-group select {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #444;
            background: #212121;
            color: #fff;
            font-size: 14px;
        }

        .save-btn {
            background-color: #2e7d32;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        /* Griglia dei 13 tasti all'interno del menu */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .menu-grid-btn {
            background: #212121;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
            padding: 10px;
            border-radius: 8px;
            text-align: left;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .menu-grid-btn:active {
            background: #424242;
        }

        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: #212121;
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <!-- Mappa Leaflet -->
    <div id="map"></div>

    <!-- Modale Unica per Guide e Menu -->
    <div id="modalBox" class="modal-box">
        <div class="modal-title">
            <span id="modalTitleText">SentieroVivo</span>
            <span style="cursor:pointer; color:#fff; font-size: 20px; padding: 0 5px;" onclick="closeModal()">✕</span>
        </div>
        <div id="modalContentText">Contenuto...</div>
    </div>

    <!-- Plancia Comandi Essenziale in BASSO -->
    <div class="control-panel">
        <div class="panel-row">
            <!-- Sinistra: Info Web -->
            <button class="btn btn-web" onclick="triggerWebInfo()">🌐 Info Web</button>
            
            <!-- Centro: Tasto Rapido Waypoint Manuale -->
            <button class="btn btn-manual-wp" onclick="markManualWaypoint()">📍 Waypoint (<span id="wp-counter">0</span>)</button>
            
            <!-- Destra: Menu dei 13 comandi -->
            <button class="btn btn-menu" onclick="openCommandMenu()">📂 Menu (13)</button>
        </div>

        <div class="status-bar">
            <span>GPS: <strong id="gps-status" style="color: #66bb6a;">Ricerca...</strong></span>
            <span>Traccia: <strong id="track-status">Inattiva</strong></span>
            <span>WP: <strong id="wp-total">0</strong></span>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inizializzazione della mappa (Centrata su Livorno)
        const map = L.map('map', { zoomControl: false }).setView([43.5485, 10.3106], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors | SentieroVivo'
        }).addTo(map);

        L.control.zoom({ position: 'topright' }).addTo(map);

        let trackingState = 'INACTIVE'; // INACTIVE, RECORDING, PAUSED
        let waypointCount = 0;
        let waypointsList = [];
        let currentPositionMarker = null;
        let accuracyCircle = null;
        let trackLine = L.polyline([], { color: '#2e7d32', weight: 5, opacity: 0.85 }).addTo(map);
        
        let audioEnabled = true;

        function speakText(text) {
            if (!audioEnabled || !('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'it-IT';
            utterance.rate = 1.0;
            
            const voices = window.speechSynthesis.getVoices();
            const femaleVoice = voices.find(v => v.lang.includes('it') && (v.name.toLowerCase().includes('elena') || v.name.toLowerCase().includes('alice') || v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('elsa')));
            if (femaleVoice) {
                utterance.voice = femaleVoice;
            } else {
                const anyIt = voices.find(v => v.lang.includes('it'));
                if (anyIt) utterance.voice = anyIt;
            }
            window.speechSynthesis.speak(utterance);
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
        }

        // Info Web
        function triggerWebInfo() {
            const infoText = "Analisi della posizione corrente: ti trovi in un'area collinare protetta. A circa 800 metri verso nord si sviluppa un sentiero panoramico con vegetazione di macchia mediterranea e lecci.";
            showModal("Guida Territoriale & Info Web", infoText);
            speakText("Ti trovi in area protetta. A ottocento metri a nord si sviluppa un sentiero panoramico.");
        }

        // Waypoint Manuale
        function markManualWaypoint() {
            waypointCount++;
            document.getElementById('wp-counter').innerText = waypointCount;
            document.getElementById('wp-total').innerText = waypointCount;

            const latlng = currentPositionMarker ? currentPositionMarker.getLatLng() : map.getCenter();
            const marker = L.circleMarker(latlng, {
                radius: 8, color: '#fff', fillColor: '#ff8f00', fillOpacity: 1, weight: 2
            }).addTo(map);

            marker.bindPopup(`<b>Waypoint Manuale #${waypointCount}</b><br>Boa di sicurezza registrata.`);
            waypointsList.push({ id: waypointCount, latlng: latlng });

            speakText(`Waypoint numero ${waypointCount} registrato.`);
        }

        // Apertura Menu dei 13 Comandi (Con tasto Pausa e Stop & Salva dedicati)
        function openCommandMenu() {
            let audioStatusText = audioEnabled ? "🔊 Voce: ATTIVA" : "🔇 Voce: DISATTIVATA";
            let pauseResumeText = trackingState === 'PAUSED' ? "▶ Riprendi Registrazione" : "⏸ Pausa Percorso";
            
            let menuHTML = `
                <p>Seleziona una funzione:</p>
                <div class="menu-grid">
                    <button class="menu-grid-btn" onclick="runMenuAction('Avvia Percorso')">▶ 1. Avvia Tracciamento</button>
                    <button class="menu-grid-btn" onclick="runMenuAction('Pausa Percorso')">${pauseResumeText}</button>
                    <button class="menu-grid-btn" onclick="runMenuAction('Stop & Salva')">⏹ 3. Stop & Salva (Cartella)</button>
                    <button class="menu-grid-btn" onclick="runMenuAction('Ritorno a Ritroso')">↩ 4. Ritorno (Backtrack)</button>
                    <button class="menu-grid-btn" onclick="runMenuAction('Nuovo Anello')">🔄 5. Calcola Anello</button>
                    <button class="menu-grid-btn" onclick="runMenuAction('Cerca Fontane POI')">💧 6. Cerca Acqua / POI</button>
                    <button class="menu-grid-btn" onclick="runMenuAction('Esplora Sentiero')">🔍 7. Predici Sentiero</button>
                    <button class="menu-grid-btn" onclick="runMenuAction('Gestione Cartelle')">📁 8. Cartelle Percorsi</button>
                    <button class="menu-grid-btn" onclick="runMenuAction('Esportazione GPX')">💾 9. Esporta GPX</button>
                    <button class="menu-grid-btn" onclick="runMenuAction('Note Vocali')">🎙️ 10. Registro Audio</button>
                    <button class="menu-grid-btn" onclick="runMenuAction('Galleria Foto')">📷 11. Foto Waypoint</button>
                    <button class="menu-grid-btn" onclick="runMenuAction('Stato GPS & Offline')">📶 12. Diagnostica GPS</button>
                    <button class="menu-grid-btn" style="grid-column: span 2; background: #004d40;" onclick="toggleAudioVoice()">🗣️ 13. ${audioStatusText}</button>
                </div>
            `;
            showModal("Menu Comandi Avanzati (13 Scelte)", menuHTML);
            speakText("Menu comandi aperto.");
        }

        function toggleAudioVoice() {
            audioEnabled = !audioEnabled;
            if (!audioEnabled) {
                window.speechSynthesis.cancel();
            } else {
                speakText("Sintesi vocale riattivata.");
            }
            openCommandMenu();
        }

        // Gestione delle azioni del menu (Con logica di Stop & Salva con cartelle e Pausa)
        function runMenuAction(actionName) {
            if (actionName.includes('Avvia')) {
                trackingState = 'RECORDING';
                document.getElementById('track-status').innerText = 'In Corso';
                document.getElementById('track-status').style.color = '#66bb6a';
                speakText("Registrazione del percorso avviata.");
                closeModal();
                showModal("Stato Tracciamento", "Registrazione in corso...");
            } 
            else if (actionName.includes('Pausa') || actionName.includes('Riprendi')) {
                if (trackingState === 'RECORDING') {
                    trackingState = 'PAUSED';
                    document.getElementById('track-status').innerText = 'In Pausa';
                    document.getElementById('track-status').style.color = '#ff8f00';
                    speakText("Registrazione in pausa.");
                    showModal("Stato Tracciamento", "Registrazione messa in pausa.");
                } else if (trackingState === 'PAUSED') {
                    trackingState = 'RECORDING';
                    document.getElementById('track-status').innerText = 'In Corso';
                    document.getElementById('track-status').style.color = '#66bb6a';
                    speakText("Registrazione ripresa.");
                    showModal("Stato Tracciamento", "Registrazione ripresa.");
                } else {
                    showModal("Avviso", "Nessun percorso attivo da mettere in pausa. Avvia prima la registrazione.");
                }
            }
            else if (actionName.includes('Stop & Salva')) {
                // Apre il pannello di salvataggio personalizzato con scelta cartella e nome
                openSaveDialog();
            } 
            else {
                speakText(`Attivato ${actionName}`);
                showModal("Esecuzione Comando", `Funzione <b>${actionName}</b> selezionata.`);
            }
        }

        // Finestra dedicata al salvataggio (Scegli cartella o scrivi nome)
        function openSaveDialog() {
            trackingState = 'INACTIVE';
            document.getElementById('track-status').innerText = 'Salvato';
            document.getElementById('track-status').style.color = '#0277bd';
            speakText("Inserisci il nome del percorso e seleziona la cartella di destinazione.");

            let saveHTML = `
                <p>Termina escursione e archivia il tracciato:</p>
                <div class="input-group">
                    <label>Nome del Percorso:</label>
                    <input type="text" id="trackNameInput" value="Escursione_${new Date().toLocaleDateString().replace(/\//g, '-')}" />
                </div>
                <div class="input-group">
                    <label>Seleziona Cartella di Destinazione:</label>
                    <select id="folderSelect">
                        <option value="Trekking_Montagna">Trekking Montagna</option>
                        <option value="Passeggiate_Collina">Passeggiate Collina</option>
                        <option value="Uscite_Urbane">Uscite Urbane</option>
                        <option value="Nuova_Cartella">+ Crea Nuova Cartella...</option>
                    </select>
                </div>
                <div class="input-group" id="newFolderBox" style="display:none;">
                    <label>Nome Nuova Cartella:</label>
                    <input type="text" id="newFolderNameInput" placeholder="Es. Ferie_Toscana_2026" />
                </div>
                <button class="save-btn" onclick="confirmSaveTrack()">💾 Conferma e Salva sul Telefono</button>
            `;
            showModal("Salvataggio Percorso", saveHTML);

            // Gestione visibilità input nuova cartella
            setTimeout(() => {
                const select = document.getElementById('folderSelect');
                if (select) {
                    select.onchange = (e) => {
                        document.getElementById('newFolderBox').style.display = (e.target.value === 'Nuova_Cartella') ? 'flex' : 'none';
                    };
                }
            }, 100);
        }

        function confirmSaveTrack() {
            const trackName = document.getElementById('trackNameInput').value || 'Percorso_Senza_Nome';
            let folder = document.getElementById('folderSelect').value;
            if (folder === 'Nuova_Cartella') {
                folder = document.getElementById('newFolderNameInput.value') || 'Cartella_Personalizzata';
            }

            speakText(`Percorso salvato con successo nella cartella ${folder}.`);
            closeModal();
            showModal("Salvataggio Completato", `Il tracciato <b>${trackName}</b> è stato archiviato correttamente nella cartella <b>${folder}</b>.`);
        }

        function showModal(title, htmlContent) {
            document.getElementById('modalTitleText').innerText = title;
            document.getElementById('modalContentText').innerHTML = htmlContent;
            document.getElementById('modalBox').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('modalBox').style.display = 'none';
        }

        // Geolocation reale e visibile
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(position => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const accuracy = position.coords.accuracy;
                const latlng = [lat, lon];

                document.getElementById('gps-status').innerText = "Attivo (GPS)";
                document.getElementById('gps-status').style.color = "#66bb6a";

                if (!currentPositionMarker) {
                    currentPositionMarker = L.circleMarker(latlng, {
                        radius: 9, color: '#ffffff', fillColor: '#2196f3', fillOpacity: 1, weight: 3
                    }).addTo(map).bindPopup("La tua posizione attuale");

                    accuracyCircle = L.circle(latlng, {
                        radius: accuracy, color: '#2196f3', fillColor: '#2196f3', fillOpacity: 0.15, weight: 1
                    }).addTo(map);

                    map.setView(latlng, 16);
                } else {
                    currentPositionMarker.setLatLng(latlng);
                    accuracyCircle.setLatLng(latlng);
                    accuracyCircle.setRadius(accuracy);
                }

                if (trackingState === 'RECORDING') {
                    trackLine.addLatLng(latlng);
                }
            }, error => {
                console.warn("GPS non disponibile.");
                document.getElementById('gps-status').innerText = "Simulato";
                document.getElementById('gps-status').style.color = "#ff8f00";
                
                const fallbackLatLng = [43.5485, 10.3106];
                if (!currentPositionMarker) {
                    currentPositionMarker = L.circleMarker(fallbackLatLng, {
                        radius: 9, color: '#fff', fillColor: '#2196f3', fillOpacity: 1, weight: 3
                    }).addTo(map).bindPopup("Posizione di Simulazione");
                }
            }, { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
        }
    </script>
</body>
</html>
