<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SentieroVivo - Navigazione Escursionistica Professionale</title>
    <!-- Leaflet CSS per le mappe offline/online -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        :root {
            --primary-color: #2e7d32;
            --accent-color: #ff8f00;
            --menu-color: #00838f;
            --web-color: #0277bd;
            --bg-dark: #121212;
            --panel-bg: rgba(18, 18, 18, 0.94);
            --text-light: #f1f1f1;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-dark);
            color: var(--text-light);
        }

        #map {
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }

        /* Plancia essenziale in BASSO: pulita, con soli 3 comandi chiave */
        .control-panel {
            position: absolute;
            bottom: 20px;
            left: 15px;
            right: 15px;
            z-index: 10;
            background: var(--panel-bg);
            padding: 12px 15px;
            border-radius: 14px;
            backdrop-filter: blur(10px);
            box-shadow: 0 -4px 25px rgba(0,0,0,0.6);
            display: flex;
            flex-direction: column;
            gap: 10px;
            border: 1px solid rgba(255,255,255,0.15);
        }

        .panel-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 12px 14px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            transition: transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            flex: 1;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-web { background-color: var(--web-color); }
        .btn-menu { background-color: var(--menu-color); }
        .btn-manual-wp { 
            background-color: var(--accent-color); 
            color: #000; 
            font-weight: 800; 
            flex: 1.5; /* Leggermente più largo per risaltare al centro */
            font-size: 14px;
        }

        /* Status bar essenziale */
        .status-bar {
            font-size: 12px;
            color: #b0bec5;
            background: rgba(0,0,0,0.4);
            padding: 5px 8px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* Finestra modale (Risposte Guide / Menu 12 tasti) */
        .modal-box {
            position: absolute;
            top: 15px;
            left: 15px;
            right: 15px;
            z-index: 20;
            background: var(--panel-bg);
            padding: 18px;
            border-radius: 14px;
            backdrop-filter: blur(10px);
            border-left: 4px solid var(--accent-color);
            box-shadow: 0 6px 25px rgba(0,0,0,0.7);
            display: none;
            font-size: 14px;
            line-height: 1.5;
            max-height: 80vh;
            overflow-y: auto;
        }

        .modal-title {
            font-weight: bold;
            color: var(--accent-color);
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            font-size: 16px;
        }

        /* Griglia dei 12 tasti all'interno del menu */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 12px;
        }

        .menu-grid-btn {
            background: #212121;
            color: #fff;
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px;
            border-radius: 8px;
            text-align: left;
            font-size: 12px;
            cursor: pointer;
        }

        .menu-grid-btn:active {
            background: #333;
        }

        .leaflet-popup-content-wrapper, .leaflet-popup-tip {
            background: #212121;
            color: #fff;
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <!-- Mappa Leaflet -->
    <div id="map"></div>

    <!-- Modale Unica per Guide e Menu dei 12 Comandi -->
    <div id="modalBox" class="modal-box">
        <div class="modal-title">
            <span id="modalTitleText">SentieroVivo</span>
            <span style="cursor:pointer; color:#aaa; font-size: 18px;" onclick="closeModal()">✕</span>
        </div>
        <div id="modalContentText">Contenuto...</div>
    </div>

    <!-- Plancia Comandi Essenziale in BASSO -->
    <div class="control-panel">
        <div class="panel-row">
            <!-- Sinistra: Info Web -->
            <button class="btn btn-web" onclick="triggerWebInfo()">🌐 Info Web</button>
            
            <!-- Centro: Tasto Rapido Waypoint Manuale (Filo di Arianna) -->
            <button class="btn btn-manual-wp" onclick="markManualWaypoint()">📍 Waypoint (#<span id="wp-counter">0</span>)</button>
            
            <!-- Destra: Menu dei 12 comandi -->
            <button class="btn btn-menu" onclick="openCommandMenu()">📂 Menu (12)</button>
        </div>

        <div class="status-bar">
            <span>GPS: <strong id="gps-status" style="color: #66bb6a;">Attivo</strong></span>
            <span>Traccia: <strong id="track-status">Inattiva</strong></span>
            <span>WP: <strong id="wp-total">0</strong></span>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Inizializzazione della mappa (Centrata su Livorno / area test)
        const map = L.map('map', { zoomControl: false }).setView([43.5485, 10.3106], 15);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors | SentieroVivo'
        }).addTo(map);

        L.control.zoom({ position: 'topright' }).addTo(map);

        let isTracking = false;
        let waypointCount = 0;
        let waypointsList = [];
        let currentPositionMarker = null;
        let trackLine = L.polyline([], { color: '#2e7d32', weight: 4, opacity: 0.8 }).addTo(map);

        // Sintesi Vocale Voce Femminile Naturale
        function speakText(text) {
            if (!('speechSynthesis' in window)) return;
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'it-IT';
            utterance.rate = 1.0;
            
            const voices = window.speechSynthesis.getVoices();
            const femaleVoice = voices.find(v => v.lang.includes('it') && (v.name.toLowerCase().includes('elena') || v.name.toLowerCase().includes('alice') || v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('elsa')));
            if (femaleVoice) {
                utterance.voice = femaleVoice;
            } else {
                const anyIt = voices.find(v => v.lang.includes('it'));
                if (anyIt) utterance.voice = anyIt;
            }
            window.speechSynthesis.speak(utterance);
        }

        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
        }

        // Tasto Sinistra: Info Web & Guida Territoriale
        function triggerWebInfo() {
            showModal("Guida Territoriale & Info Web", 
                "Analisi della posizione corrente: ti trovi in un'area collinare protetta. A circa 800 metri verso nord si sviluppa un sentiero panoramico con vegetazione di macchia mediterranea e lecci.");
            speakText("Ti trovi in un'area protetta. A ottocento metri a nord si sviluppa un sentiero panoramico ideale per escursioni.");
        }

        // Tasto Centro: Waypoint Manuale (Filo di Arianna)
        function markManualWaypoint() {
            waypointCount++;
            document.getElementById('wp-counter').innerText = waypointCount;
            document.getElementById('wp-total').innerText = waypointCount;

            const latlng = map.getCenter();
            const marker = L.circleMarker(latlng, {
                radius: 6,
                color: '#fff',
                fillColor: '#ff8f00',
                fillOpacity: 1
            }).addTo(map);

            marker.bindPopup(`<b>Waypoint Manuale #${waypointCount}</b><br>Boa di sicurezza registrata.`);
            waypointsList.push({ id: waypointCount, latlng: latlng });

            speakText(`Waypoint numero ${waypointCount} registrato.`);
        }

        // Tasto Destra: Apertura Menu dei 12 Comandi
        function openCommandMenu() {
            let menuHTML = `
                <p>Seleziona una funzione avanzata:</p>
                <div class="menu-grid">
                    <button class="menu-grid-btn" onclick="runMenuAction('Avvia Percorso')">▶ 1. Avvia Tracciamento</button>
                    <button class="menu-grid-btn" onclick="runMenuAction('Stop & Salva')">⏹ 2. Stop & Salva</button>
                    <button class="menu-grid-btn" onclick="runMenuAction('Ritorno a Ritroso')">↩ 3. Ritorno (Backtrack)</button>
                    <button class="menu-grid-btn" onclick="runMenuAction('Nuovo Anello')">🔄 4. Calcola Anello</button>
                    <button class="menu-grid-btn" onclick="runMenuAction('Cerca Fontane POI')">💧 5. Cerca Acqua / POI</button>
                    <button class="menu-grid-btn" onclick="runMenuAction('Esplora Sentiero')">🔍 6. Predici Sentiero</button>
                    <button class="menu-grid-btn" onclick="runMenuAction('Gestione Cartelle')">📁 7. Cartelle Percorsi</button>
                    <button class="menu-grid-btn" onclick="runMenuAction('Esportazione GPX')">💾 8. Esporta GPX</button>
                    <button class="menu-grid-btn" onclick="runMenuAction('Note Vocali')">🎙️ 9. Registro Audio</button>
                    <button class="menu-grid-btn" onclick="runMenuAction('Galleria Foto')">📷 10. Foto Waypoint</button>
                    <button class="menu-grid-btn" onclick="runMenuAction('Stato GPS & Offline')">📶 11. Diagnostica GPS</button>
                    <button class="menu-grid-btn" onclick="runMenuAction('Impostazioni Voce')">⚙️ 12. Impostazioni</button>
                </div>
            `;
            showModal("Menu Comandi Avanzati (12 Scelte)", menuHTML);
            speakText("Menu comandi aperto.");
        }

        function runMenuAction(actionName) {
            if (actionName.includes('Avvia')) {
                isTracking = true;
                document.getElementById('track-status').innerText = 'Registrazione';
                document.getElementById('track-status').style.color = '#66bb6a';
                speakText("Registrazione avviata.");
            } else if (actionName.includes('Stop')) {
                isTracking = false;
                document.getElementById('track-status').innerText = 'Salvato';
                document.getElementById('track-status').style.color = '#ff8f00';
                speakText("Percorso salvato.");
            }
            closeModal();
            // Mostra conferma rapida
            showModal("Comando Eseguito", `Hai attivato: <b>${actionName}</b>`);
        }

        function showModal(title, htmlContent) {
            document.getElementById('modalTitleText').innerText = title;
            document.getElementById('modalContentText').innerHTML = htmlContent;
            document.getElementById('modalBox').style.display = 'block';
        }

        function closeModal() {
            document.getElementById('modalBox').style.display = 'none';
        }

        // Simulatore GPS
        if (navigator.geolocation) {
            navigator.geolocation.watchPosition(position => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                const latlng = [lat, lon];

                document.getElementById('gps-status').innerText = "Attivo";
                document.getElementById('gps-status').style.color = "#66bb6a";

                if (!currentPositionMarker) {
                    currentPositionMarker = L.marker(latlng).addTo(map).bindPopup("Posizione Attuale");
                } else {
                    currentPositionMarker.setLatLng(latlng);
                }

                if (isTracking) {
                    trackLine.addLatLng(latlng);
                }
            }, error => {
                console.warn("GPS non disponibile, utilizzo posizione simulata.");
            }, { enableHighAccuracy: true });
        }
    </script>
</body>
</html>
