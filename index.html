<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SentieroVivo - Trekking GPS</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      color: #ffffff;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Dashboard informativa */
    .dashboard {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: 92%;
      max-width: 450px;
      background: rgba(20, 20, 20, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 12px 16px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .dash-card {
      text-align: center;
    }

    .dash-card .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #aaaaaa;
    }

    .dash-card .value {
      font-size: 1.15rem;
      font-weight: 700;
      color: #2ec4b6;
      margin-top: 2px;
    }

    /* Controlli in basso */
    .controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      gap: 12px;
      width: 92%;
      max-width: 450px;
    }

    .btn {
      flex: 1;
      padding: 14px 10px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }

    .btn-start { background-color: #28a745; color: #ffffff; }
    .btn-stop { background-color: #dc3545; color: #ffffff; }
    .btn-reverse { background-color: #ff9f1c; color: #011627; }

    /* Indicatore Stato GPS */
    .gps-status {
      position: absolute;
      top: 90px;
      right: 16px;
      z-index: 1000;
      background: rgba(0,0,0,0.7);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #ff0000;
    }

    .dot.active {
      background-color: #28a745;
      box-shadow: 0 0 8px #28a745;
    }

    /* Stile della Freccina Blu direzionale */
    .arrow-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease;
    }

    .arrow-icon svg {
      width: 32px;
      height: 32px;
      filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.5));
    }

    /* Stile Marcatori Sosta */
    .stop-marker-icon {
      background-color: #007bff;
      color: #ffffff;
      border: 2px solid #ffffff;
      border-radius: 50%;
      font-size: 11px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <div class="dash-card">
      <div class="label">Altitudine</div>
      <div class="value" id="val-alt">--- m</div>
    </div>
    <div class="dash-card">
      <div class="label">Distanza</div>
      <div class="value" id="val-dist">0.0 km</div>
    </div>
    <div class="dash-card">
      <div class="label">Velocità</div>
      <div class="value" id="val-speed">0.0 km/h</div>
    </div>
  </div>

  <div class="gps-status">
    <div class="dot" id="gps-dot"></div>
    <span id="gps-text">GPS: In attesa...</span>
  </div>

  <div id="map"></div>

  <div class="controls">
    <button class="btn btn-start" id="btn-toggle" onclick="toggleTracking()">Avvia Registrazione</button>
    <button class="btn btn-reverse" onclick="reverseTrack()">Inverti Traccia</button>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map;
    let userMarker = null;
    let arrowMarker = null;
    let trackPolyline;
    let tracking = false;
    let trackPoints = [];
    let totalDistance = 0; // km
    let watchId = null;
    let lastAltFetchTime = 0;

    // Gestione Direzione e Freccina Blu
    let lastLatLng = null;
    let currentHeading = 0;

    // Gestione Rilevamento Soste
    let stopStartTime = null;
    let stopStartLatLng = null;
    let stopMarkers = [];
    const STOP_RADIUS_METERS = 15; // Soglia spostamento per sosta
    const STOP_TIME_THRESHOLD_MS = 2 * 60 * 1000; // 2 minuti minimo per considerare una sosta

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([43.548, 10.310], 15);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      // Traccia VERDE per il percorso registrato
      trackPolyline = L.polyline([], {
        color: '#28a745',
        weight: 5,
        opacity: 0.95,
        lineCap: 'round'
      }).addTo(map);

      startGPS();
    }

    function startGPS() {
      if (!navigator.geolocation) {
        updateGPSStatus(false, "GPS non supportato");
        return;
      }

      watchId = navigator.geolocation.watchPosition(
        onGPSSuccess,
        onGPSError,
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 2000
        }
      );
    }

    function onGPSSuccess(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const speedKm = position.coords.speed && position.coords.speed > 0 ? (position.coords.speed * 3.6) : 0;
      
      updateGPSStatus(true, "GPS Attivo");
      document.getElementById('val-speed').innerText = `${speedKm.toFixed(1)} km/h`;

      const currentLatLng = [lat, lng];

      // Calcolo direzione (heading) per la freccina blu
      if (position.coords.heading !== null && !isNaN(position.coords.heading)) {
        currentHeading = position.coords.heading;
      } else if (lastLatLng) {
        const calculatedHeading = calculateBearing(lastLatLng[0], lastLatLng[1], lat, lng);
        if (calculatedHeading !== null) currentHeading = calculatedHeading;
      }

      // Aggiorna o crea il marker con la FRECCINA BLU
      updateArrowMarker(currentLatLng, currentHeading);

      // Centra la mappa sulla posizione attuale se in movimento o primo punto
      if (!lastLatLng) {
        map.setView(currentLatLng, 16);
      } else {
        map.panTo(currentLatLng);
      }

      // Recupero Altitudine accurata via API
      fetchAccurateAltitude(lat, lng, position.coords.altitude);

      // Se la registrazione è attiva
      if (tracking) {
        if (lastLatLng) {
          const distInc = map.distance(lastLatLng, currentLatLng) / 1000;
          totalDistance += distInc;
          document.getElementById('val-dist').innerText = `${totalDistance.toFixed(2)} km`;
        }

        trackPoints.push(currentLatLng);
        trackPolyline.setLatLngs(trackPoints);

        // Controllo automatico delle soste
        checkStopDetection(currentLatLng, speedKm);
      }

      lastLatLng = currentLatLng;
    }

    // Creazione e rotazione della FRECCINA BLU
    function updateArrowMarker(latLng, heading) {
      const svgArrow = `
        <div class="arrow-icon" style="transform: rotate(${heading}deg);">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 22L12 18L22 22L12 2Z" fill="#007bff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </div>
      `;

      const customIcon = L.divIcon({
        html: svgArrow,
        className: 'custom-arrow-container',
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      });

      if (!arrowMarker) {
        arrowMarker = L.marker(latLng, { icon: customIcon }).addTo(map);
      } else {
        arrowMarker.setLatLng(latLng);
        arrowMarker.setIcon(customIcon);
      }
    }

    // Calcolo angolo/direzione tra due coordinate GPS
    function calculateBearing(lat1, lon1, lat2, lon2) {
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const lat1Rad = lat1 * Math.PI / 180;
      const lat2Rad = lat2 * Math.PI / 180;

      if (Math.abs(lat2 - lat1) < 0.00001 && Math.abs(lon2 - lon1) < 0.00001) {
        return null; // Nessun movimento significativo
      }

      const y = Math.sin(dLon) * Math.cos(lat2Rad);
      const x = Math.cos(lat1Rad) * Math.sin(lat2Rad) - Math.sin(lat1Rad) * Math.cos(lat2Rad) * Math.cos(dLon);
      let brng = Math.atan2(y, x) * 180 / Math.PI;
      return (brng + 360) % 360;
    }

    // Rilevamento automatico SOSTE
    function checkStopDetection(currentLatLng, speedKm) {
      const now = Date.now();

      if (!stopStartLatLng) {
        stopStartLatLng = currentLatLng;
        stopStartTime = now;
        return;
      }

      const distFromStopStart = map.distance(stopStartLatLng, currentLatLng);

      if (distFromStopStart < STOP_RADIUS_METERS && speedKm < 1.5) {
        const duration = now - stopStartTime;
        if (duration >= STOP_TIME_THRESHOLD_MS && !stopStartLatLng.hasMarker) {
          addStopMarker(stopStartLatLng, Math.round(duration / 60000));
          stopStartLatLng.hasMarker = true;
        }
      } else {
        // L'utente ha ripreso a camminare: resetta il punto di sosta
        stopStartLatLng = currentLatLng;
        stopStartTime = now;
      }
    }

    // Aggiunge un punto di sosta visibile sulla mappa
    function addStopMarker(latLng, minutes) {
      const stopIcon = L.divIcon({
        className: 'stop-marker-icon',
        html: `⏸ ${minutes}m`,
        iconSize: [36, 24],
        iconAnchor: [18, 12]
      });

      const marker = L.marker(latLng, { icon: stopIcon })
        .addTo(map)
        .bindPopup(`<b>Sosta di ${minutes} minuti</b>`);

      stopMarkers.push(marker);
    }

    function onGPSError(error) {
      let msg = "Errore GPS";
      if (error.code === 1) msg = "Permesso GPS negato";
      else if (error.code === 2) msg = "Segnale non disponibile";
      else if (error.code === 3) msg = "Timeout ricerca GPS";
      
      updateGPSStatus(false, msg);
    }

    function updateGPSStatus(active, message) {
      const dot = document.getElementById('gps-dot');
      const text = document.getElementById('gps-text');
      
      if (active) {
        dot.classList.add('active');
      } else {
        dot.classList.remove('active');
      }
      text.innerText = message;
    }

    // Recupero altitudine accurata via API Open-Meteo
    async function fetchAccurateAltitude(lat, lng, fallbackAlt) {
      const now = Date.now();
      if (now - lastAltFetchTime < 10000) return;
      lastAltFetchTime = now;

      try {
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`);
        if (response.ok) {
          const data = await response.json();
          if (data.elevation !== undefined) {
            document.getElementById('val-alt').innerText = `${Math.round(data.elevation)} m`;
            return;
          }
        }
      } catch (e) {
        console.warn("API altitudine offline, uso il GPS locale:", e);
      }

      if (fallbackAlt !== null && !isNaN(fallbackAlt)) {
        document.getElementById('val-alt').innerText = `${Math.round(fallbackAlt)} m`;
      }
    }

    // Avvio / Arresto Registrazione
    function toggleTracking() {
      const btn = document.getElementById('btn-toggle');
      tracking = !tracking;

      if (tracking) {
        btn.innerText = "Ferma Registrazione";
        btn.className = "btn btn-stop";
      } else {
        btn.innerText = "Avvia Registrazione";
        btn.className = "btn btn-start";
      }
    }

    // Inversione della Traccia
    function reverseTrack() {
      if (trackPoints.length < 2) {
        alert("Nessuna traccia sufficiente da invertire!");
        return;
      }
      trackPoints.reverse();
      trackPolyline.setStyle({ color: '#ff9f1c' }); // Cambia in arancione per indicare il ritorno/inversione
      trackPolyline.setLatLngs(trackPoints);
      alert("Traccia invertita! Ora la vedi evidenziata per il percorso di ritorno.");
    }

    window.onload = initMap;
  </script>
</body>
</html>
