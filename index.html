<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TREKKING GPS V8 - GUIDA VOCALE & GPX</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #1a1a1a; font-family: sans-serif; color: white; }
        #map { height: 65vh; width: 100%; background: #222; }
        .controls { height: 35vh; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px; background: #2c3e50; }
        button { border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 13px; text-transform: uppercase; cursor: pointer; }
        .btn-start { background: #27ae60; grid-column: span 2; font-size: 16px; height: 60px; }
        .btn-pause { background: #e67e22; }
        .btn-reverse { background: #2980b9; }
        .btn-file { background: #8e44ad; color: white; display: flex; align-items: center; justify-content: center; border-radius: 8px; font-weight: bold; font-size: 13px; }
        .btn-save { background: #f1c40f; color: black; }
        .btn-reset { background: #7f8c8d; grid-column: span 2; }
        .recording { background: #c0392b !important; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        #status { position: absolute; top: 10px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.8); padding: 5px 12px; border-radius: 20px; font-size: 11px; border: 1px solid #27ae60; }
    </style>
</head>
<body>

    <div id="status">In attesa di segnale GPS...</div>
    <div id="map"></div>

    <div class="controls">
        <button id="startBtn" class="btn-start">▶ Inizia Percorso</button>
        <button id="pauseBtn" class="btn-pause">🚩 Sosta/Riparti</button>
        <button id="reverseBtn" class="btn-reverse">🔄 A Ritroso</button>
        
        <label class="btn-file">
            📂 Carica GPX
            <input type="file" id="loadFile" hidden accept=".gpx,.json">
        </label>
        
        <button id="saveBtn" class="btn-save">💾 Salva GPX</button>
        <button id="resetBtn" class="btn-reset">🗑️ Reset Totale</button>
    </div>

    <script>
        let map, pathLine, userArrow, coords = [], watchId = null;
        let isPaused = false, isReversed = false;
        let lastVoiceWarning = 0; // Per evitare che la voce parli continuamente

        map = L.map('map', { zoomControl: true }).setView([45, 9], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        const arrowIcon = L.divIcon({
            html: `<div id="arrowImg" style="transform: rotate(0deg); font-size: 30px; transition: transform 0.3s;">⬆️</div>`,
            className: 'arrow-icon', iconSize: [30, 30], iconAnchor: [15, 15]
        });

        userArrow = L.marker([0,0], {icon: arrowIcon}).addTo(map);
        pathLine = L.polyline([], {color: '#2ecc71', weight: 6}).addTo(map);

        // Sintesi Vocale
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // Interrompe frasi precedenti
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'it-IT';
                window.speechSynthesis.speak(utterance);
            }
        }

        // Calcolo distanza in metri tra due coordinate Lat/Lng
        function getDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
            return R * c;
        }

        // Trova la minima distanza tra la posizione attuale e qualsiasi punto della traccia
        function getMinDistanceToTrack(currentPos) {
            if (coords.length === 0) return 0;
            let minDistance = Infinity;
            coords.forEach(p => {
                const d = getDistanceMeters(currentPos[0], currentPos[1], p[0], p[1]);
                if (d < minDistance) minDistance = d;
            });
            return minDistance;
        }

        function updatePos(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const pos = [lat, lng];
            
            if (coords.length > 0) {
                const last = coords[coords.length-1];
                let angle = Math.atan2(lng - last[1], lat - last[0]) * 180 / Math.PI;
                if (isReversed) angle += 180;
                document.getElementById('arrowImg').style.transform = `rotate(${angle}deg)`;
            }

            userArrow.setLatLng(pos);
            document.getElementById('status').innerText = `🟢 GPS OK | Punti: ${coords.length}`;

            // Registrazione attiva in andata
            if (watchId !== null && !isPaused && !isReversed) {
                coords.push(pos);
                pathLine.setLatLngs(coords);
                map.panTo(pos);
            }

            // CONTROLLO VOCALE IN MODALITÀ A RITROSO
            if (isReversed && coords.length > 1) {
                const minDistance = getMinDistanceToTrack(pos);
                const now = Date.now();

                // Avviso Fuori Traccia (> 25 metri) ogni 15 secondi
                if (minDistance > 25 && (now - lastVoiceWarning > 15000)) {
                    speak(`Attenzione! Sei fuori percorso di ${Math.round(minDistance)} metri.`);
                    lastVoiceWarning = now;
                }

                // Avviso Arrivo alla partenza originale (< 15 metri dal punto 0)
                const startPos = coords[0];
                const distToStart = getDistanceMeters(lat, lng, startPos[0], startPos[1]);
                if (distToStart < 15 && (now - lastVoiceWarning > 30000)) {
                    speak("Sei arrivato a destinazione al punto di partenza!");
                    lastVoiceWarning = now;
                }
            }
        }

        document.getElementById('startBtn').onclick = function() {
            if (watchId === null) {
                coords = []; pathLine.setLatLngs([]);
                watchId = navigator.geolocation.watchPosition(updatePos, (err) => console.log(err), {enableHighAccuracy: true});
                this.innerText = "⏹ Concludi";
                this.classList.add('recording');
                speak("Registrazione percorso avviata.");
            } else {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                this.innerText = "▶ Inizia Percorso";
                this.classList.remove('recording');
                speak("Percorso concluso e salvato.");
                saveGPX();
            }
        };

        document.getElementById('pauseBtn').onclick = function() {
            isPaused = !isPaused;
            this.style.background = isPaused ? "#7f8c8d" : "#e67e22";
            if(isPaused) {
                L.marker(userArrow.getLatLng(), {icon: L.divIcon({html:'🚩', iconSize:[25,25]})}).addTo(map);
                speak("Sosta attivata.");
            } else {
                speak("Ripresa del percorso.");
            }
        };

        document.getElementById('reverseBtn').onclick = function() {
            if (coords.length < 2) return alert("Percorso troppo breve per l'inversione");
            isReversed = !isReversed;
            this.style.background = isReversed ? "#c0392b" : "#2980b9";
            if (isReversed) {
                speak("Modalità a ritroso attivata. Segui il percorso all'indietro. Ti avviserò se esci dalla traccia.");
            } else {
                speak("Modalità normale ripristinata.");
            }
        };

        // SALVATAGGIO GPX
        function saveGPX() {
            if (coords.length < 2) return;
            let gpxContent = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="TrekkingApp" xmlns="http://www.topografix.com/GPX/1/1">
  <trk><name>Percorso Trekking</name><trkseg>`;
            
            coords.forEach(p => {
                gpxContent += `<trkpt lat="${p[0]}" lon="${p[1]}"></trkpt>`;
            });

            gpxContent += `</trkseg></trk></gpx>`;
            
            const blob = new Blob([gpxContent], {type: "application/gpx+xml"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `trekking_${new Date().getTime()}.gpx`;
            a.click();
        }
        document.getElementById('saveBtn').onclick = saveGPX;

        // CARICAMENTO GPX O JSON
        document.getElementById('loadFile').onchange = function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(event) {
                const text = event.target.result;
                coords = [];
                
                if (text.includes('<gpx')) {
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(text, "text/xml");
                    const pts = xml.getElementsByTagName("trkpt");
                    for (let i = 0; i < pts.length; i++) {
                        coords.push([parseFloat(pts[i].getAttribute("lat")), parseFloat(pts[i].getAttribute("lon"))]);
                    }
                } else {
                    coords = JSON.parse(text);
                }

                pathLine.setLatLngs(coords);
                map.fitBounds(pathLine.getBounds());
                speak("Percorso caricato sulla mappa.");
            };
            reader.readAsText(file);
        };

        document.getElementById('resetBtn').onclick = function() {
            if(confirm("Vuoi cancellare tutto?")) location.reload();
        };

        navigator.geolocation.getCurrentPosition(updatePos);
    </script>
</body>
</html>
