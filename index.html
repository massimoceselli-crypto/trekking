<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENTIEROVIVO - GPS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #1a1a1a; font-family: sans-serif; color: white; }
        /* Mappa più grande */
        #map { height: 72vh; width: 100%; background: #222; }
        
        /* Griglia dei pulsanti più compatta */
        .controls { height: 28vh; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 8px; background: #2c3e50; box-sizing: border-box; }
        
        /* Stile pulsanti: riquadri piccoli, testo grande */
        button, label.btn-file { 
            border: none; border-radius: 8px; color: white; font-weight: bold; 
            font-size: 15px; text-transform: uppercase; cursor: pointer;
            display: flex; align-items: center; justify-content: center; text-align: center;
            box-shadow: 0 3px #1a252f; padding: 2px;
        }
        button:active, label.btn-file:active { transform: translateY(2px); box-shadow: 0 1px #1a252f; }
        
        .btn-start { background: #27ae60; grid-column: span 3; font-size: 18px; }
        .btn-photo { background: #e67e22; }
        .btn-pause { background: #d35400; }
        .btn-reverse { background: #2980b9; }
        .btn-file { background: #8e44ad; }
        .btn-save { background: #f1c40f; color: black; }
        .btn-reset { background: #7f8c8d; }
        
        .recording { background: #c0392b !important; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
        
        #status { position: absolute; top: 10px; left: 10px; z-index: 1000; background: rgba(0,0,0,0.8); padding: 5px 12px; border-radius: 20px; font-size: 11px; border: 1px solid #27ae60; }
        
        /* Stile freccia di marcia */
        .arrow-icon { display: flex; align-items: center; justify-content: center; }
        #arrowImg { font-size: 32px; transition: transform 0.3s ease; }
    </style>
</head>
<body>

    <div id="status">In attesa di segnale GPS...</div>
    <div id="map"></div>

    <!-- Pannello Controlli -->
    <div class="controls">
        <button id="startBtn" class="btn-start">▶ Inizia Percorso</button>
        
        <button id="photoBtn" class="btn-photo">📷 Foto</button>
        <button id="pauseBtn" class="btn-pause">🚩 Sosta</button>
        <button id="reverseBtn" class="btn-reverse">🔄 A Ritroso</button>
        
        <label class="btn-file">
            📂 Carica
            <input type="file" id="loadFile" hidden accept=".gpx,.json">
        </label>
        <button id="saveBtn" class="btn-save">💾 Salva</button>
        <button id="resetBtn" class="btn-reset">🗑️ Reset</button>

        <!-- Input file nascosto per scattare foto -->
        <input type="file" id="cameraInput" accept="image/*" capture="camera" hidden>
    </div>

    <script>
        let map, pathLine, userArrow, coords = [], watchId = null;
        let isPaused = false, isReversed = false;
        let lastVoiceWarning = 0;
        let photoCounter = 1;
        let photoBaseName = "";

        // Inizializzazione Mappa
        map = L.map('map', { zoomControl: true }).setView([45, 9], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

        // Icona Freccia Posizione
        const arrowIcon = L.divIcon({
            html: `<div id="arrowImg">⬆️</div>`,
            className: 'arrow-icon', iconSize: [32, 32], iconAnchor: [16, 16]
        });

        userArrow = L.marker([0,0], {icon: arrowIcon}).addTo(map);
        pathLine = L.polyline([], {color: '#2ecc71', weight: 6}).addTo(map);

        // Sintesi Vocale
        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'it-IT';
                window.speechSynthesis.speak(utterance);
            }
        }

        // Calcolo Distanza
        function getDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function getMinDistanceToTrack(currentPos) {
            if (coords.length === 0) return 0;
            let minDistance = Infinity;
            coords.forEach(p => {
                const d = getDistanceMeters(currentPos[0], currentPos[1], p[0], p[1]);
                if (d < minDistance) minDistance = d;
            });
            return minDistance;
        }

        // Aggiornamento Posizione e Orientamento Freccia
        function updatePos(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const pos = [lat, lng];
            
            // Calcolo rotazione freccia
            if (coords.length > 0) {
                const last = coords[coords.length-1];
                let angle = Math.atan2(lng - last[1], lat - last[0]) * 180 / Math.PI;
                if (isReversed) angle += 180;
                const arrowEl = document.getElementById('arrowImg');
                if (arrowEl) arrowEl.style.transform = `rotate(${angle}deg)`;
            }

            userArrow.setLatLng(pos);
            document.getElementById('status').innerText = `🟢 GPS OK | Punti: ${coords.length}`;

            // Registrazione
            if (watchId !== null && !isPaused && !isReversed) {
                coords.push(pos);
                pathLine.setLatLngs(coords);
                map.panTo(pos);
            }

            // Controllo Vocale Fuori Traccia
            if (isReversed && coords.length > 1) {
                const minDistance = getMinDistanceToTrack(pos);
                const now = Date.now();

                if (minDistance > 25 && (now - lastVoiceWarning > 15000)) {
                    speak(`Attenzione! Sei fuori percorso di ${Math.round(minDistance)} metri.`);
                    lastVoiceWarning = now;
                }

                const startPos = coords[0];
                const distToStart = getDistanceMeters(lat, lng, startPos[0], startPos[1]);
                if (distToStart < 15 && (now - lastVoiceWarning > 30000)) {
                    speak("Sei arrivato a destinazione al punto di partenza!");
                    lastVoiceWarning = now;
                }
            }
        }

        // --- GESTIONE FOTO ---
        document.getElementById('photoBtn').onclick = function() {
            if (photoBaseName === "") {
                let name = prompt("Inserisci il nome base per le foto del percorso (es. Escursione):", "Foto_Trekking");
                if (!name) return;
                photoBaseName = name.replace(/[^a-zA-Z0-9_-]/g, "_");
            }
            document.getElementById('cameraInput').click();
        };

        document.getElementById('cameraInput').onchange = function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const currentPos = userArrow.getLatLng();
            const fileName = `${photoBaseName}_${photoCounter}.jpg`;

            // Scarica la foto nel telefono con il nome numerato
            const a = document.createElement('a');
            a.href = URL.createObjectURL(file);
            a.download = fileName;
            a.click();

            // Aggiunge la foto come Marker sulla mappa
            const photoUrl = URL.createObjectURL(file);
            const photoMarker = L.marker([currentPos.lat, currentPos.lng], {
                icon: L.divIcon({html: '📸', iconSize: [28, 28], className: 'photo-pin'})
            }).addTo(map);

            photoMarker.bindPopup(`
                <div style="text-align:center">
                    <b>${fileName}</b><br>
                    <img src="${photoUrl}" style="width:150px; height:auto; border-radius:5px; margin-top:5px;"><br>
                    <small>Punto foto salvato sul percorso</small>
                </div>
            `);

            speak(`Foto ${photoCounter} salvata.`);
            photoCounter++;
        };

        // --- PULSANTI DI NAVIGAZIONE ---
        document.getElementById('startBtn').onclick = function() {
            if (watchId === null) {
                coords = []; pathLine.setLatLngs([]);
                photoCounter = 1; photoBaseName = "";
                watchId = navigator.geolocation.watchPosition(updatePos, (err) => console.log(err), {enableHighAccuracy: true});
                this.innerText = "⏹ Concludi";
                this.classList.add('recording');
                speak("SENTIEROVIVO: Registrazione avviata.");
            } else {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                this.innerText = "▶ Inizia Percorso";
                this.classList.remove('recording');
                speak("Percorso concluso e salvato.");
                saveGPX();
            }
        };

        document.getElementById('pauseBtn').onclick = function() {
            isPaused = !isPaused;
            this.style.background = isPaused ? "#7f8c8d" : "#d35400";
            if(isPaused) {
                L.marker(userArrow.getLatLng(), {icon: L.divIcon({html:'🚩', iconSize:[25,25]})}).addTo(map);
                speak("Sosta attivata.");
            } else {
                speak("Ripresa del percorso.");
            }
        };

        document.getElementById('reverseBtn').onclick = function() {
            if (coords.length < 2) return alert("Percorso troppo breve per l'inversione");
            isReversed = !isReversed;
            this.style.background = isReversed ? "#c0392b" : "#2980b9";
            if (isReversed) {
                speak("Modalità a ritroso attivata. Segui la freccia al contrario.");
            } else {
                speak("Modalità normale ripristinata.");
            }
        };

        // SALVATAGGIO GPX
        function saveGPX() {
            if (coords.length < 2) return;
            let gpxContent = `<?xml version="1.0" encoding="UTF-8"?>
<gpx version="1.1" creator="SENTIEROVIVO" xmlns="http://www.topografix.com/GPX/1/1">
  <trk><name>Percorso SENTIEROVIVO</name><trkseg>`;
            
            coords.forEach(p => {
                gpxContent += `<trkpt lat="${p[0]}" lon="${p[1]}"></trkpt>`;
            });

            gpxContent += `</trkseg></trk></gpx>`;
            
            const blob = new Blob([gpxContent], {type: "application/gpx+xml"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `SENTIEROVIVO_${new Date().getTime()}.gpx`;
            a.click();
        }
        document.getElementById('saveBtn').onclick = saveGPX;

        // CARICAMENTO GPX O JSON
        document.getElementById('loadFile').onchange = function(e) {
            const file = e.target.files[0];
            const reader = new FileReader();
            reader.onload = function(event) {
                const text = event.target.result;
                coords = [];
                
                if (text.includes('<gpx')) {
                    const parser = new DOMParser();
                    const xml = parser.parseFromString(text, "text/xml");
                    const pts = xml.getElementsByTagName("trkpt");
                    for (let i = 0; i < pts.length; i++) {
                        coords.push([parseFloat(pts[i].getAttribute("lat")), parseFloat(pts[i].getAttribute("lon"))]);
                    }
                } else {
                    coords = JSON.parse(text);
                }

                pathLine.setLatLngs(coords);
                map.fitBounds(pathLine.getBounds());
                speak("Percorso caricato sulla mappa.");
            };
            reader.readAsText(file);
        };

        document.getElementById('resetBtn').onclick = function() {
            if(confirm("Vuoi cancellare tutto?")) location.reload();
        };

        navigator.geolocation.getCurrentPosition(updatePos);
    </script>
</body>
</html>
