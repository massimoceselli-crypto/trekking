<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SentieroVivo - Trekking GPS</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      color: #ffffff;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Dashboard informativa */
    .dashboard {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: 92%;
      max-width: 480px;
      background: rgba(20, 20, 20, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 10px 14px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .dash-card {
      text-align: center;
    }

    .dash-card .label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #aaaaaa;
    }

    .dash-card .value {
      font-size: 1.1rem;
      font-weight: 700;
      color: #2ec4b6;
      margin-top: 2px;
    }

    /* Pulsanti di Controllo in Basso Grid a 2 Righe */
    .controls {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 92%;
      max-width: 480px;
    }

    .btn-row {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .btn {
      flex: 1;
      padding: 12px 8px;
      border: none;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .btn-start { background-color: #28a745; color: #ffffff; }
    .btn-stop { background-color: #dc3545; color: #ffffff; }
    .btn-pause { background-color: #17a2b8; color: #ffffff; }
    .btn-bivio { background-color: #ffc107; color: #000000; }
    .btn-reverse { background-color: #ff9f1c; color: #011627; }

    /* Indicatore Stato GPS */
    .gps-status {
      position: absolute;
      top: 82px;
      right: 16px;
      z-index: 1000;
      background: rgba(0,0,0,0.7);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #ff0000;
    }

    .dot.active {
      background-color: #28a745;
      box-shadow: 0 0 8px #28a745;
    }

    /* Freccina Blu Direzionale */
    .arrow-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.3s ease;
    }

    .arrow-icon svg {
      width: 32px;
      height: 32px;
      filter: drop-shadow(0px 2px 4px rgba(0, 0, 0, 0.5));
    }

    /* Stili Marcatori Personalizzati */
    .stop-marker-icon {
      background-color: #17a2b8;
      color: #ffffff;
      border: 2px solid #ffffff;
      border-radius: 50%;
      font-size: 11px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    .bivio-marker-icon {
      background-color: #ffc107;
      color: #000000;
      border: 2px solid #000000;
      border-radius: 50%;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <div class="dash-card">
      <div class="label">Altitudine</div>
      <div class="value" id="val-alt">--- m</div>
    </div>
    <div class="dash-card">
      <div class="label">Distanza</div>
      <div class="value" id="val-dist">0.0 km</div>
    </div>
    <div class="dash-card">
      <div class="label">Velocità</div>
      <div class="value" id="val-speed">0.0 km/h</div>
    </div>
  </div>

  <div class="gps-status">
    <div class="dot" id="gps-dot"></div>
    <span id="gps-text">GPS: In attesa...</span>
  </div>

  <div id="map"></div>

  <div class="controls">
    <div class="btn-row">
      <button class="btn btn-pause" onclick="addManualStop()">⏸ Aggiungi Sosta</button>
      <button class="btn btn-bivio" onclick="addBivioMarker()">🔀 Segnala Bivio</button>
    </div>
    <div class="btn-row">
      <button class="btn btn-start" id="btn-toggle" onclick="toggleTracking()">Avvia Registrazione</button>
      <button class="btn btn-reverse" onclick="reverseTrack()">Inverti Traccia</button>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map;
    let arrowMarker = null;
    let trackPolyline;
    let tracking = false;
    let trackPoints = [];
    let totalDistance = 0;
    let watchId = null;
    let lastAltFetchTime = 0;

    let lastLatLng = null;
    let currentHeading = 0;

    let stopCount = 0;
    let bivioCount = 0;
    let bivioLocations = [];

    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([43.548, 10.310], 15);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      // Sentiero VERDE
      trackPolyline = L.polyline([], {
        color: '#28a745',
        weight: 5,
        opacity: 0.95,
        lineCap: 'round'
      }).addTo(map);

      startGPS();
    }

    function startGPS() {
      if (!navigator.geolocation) {
        updateGPSStatus(false, "GPS non supportato");
        return;
      }

      watchId = navigator.geolocation.watchPosition(
        onGPSSuccess,
        onGPSError,
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 2000
        }
      );
    }

    function onGPSSuccess(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const speedKm = position.coords.speed && position.coords.speed > 0 ? (position.coords.speed * 3.6) : 0;
      
      updateGPSStatus(true, "GPS Attivo");
      document.getElementById('val-speed').innerText = `${speedKm.toFixed(1)} km/h`;

      const currentLatLng = [lat, lng];

      // Calcolo direzione per Freccia Blu
      if (position.coords.heading !== null && !isNaN(position.coords.heading)) {
        currentHeading = position.coords.heading;
      } else if (lastLatLng) {
        const calculatedHeading = calculateBearing(lastLatLng[0], lastLatLng[1], lat, lng);
        if (calculatedHeading !== null) currentHeading = calculatedHeading;
      }

      updateArrowMarker(currentLatLng, currentHeading);

      if (!lastLatLng) {
        map.setView(currentLatLng, 16);
      } else {
        map.panTo(currentLatLng);
      }

      fetchAccurateAltitude(lat, lng, position.coords.altitude);

      if (tracking) {
        if (lastLatLng) {
          const distInc = map.distance(lastLatLng, currentLatLng) / 1000;
          totalDistance += distInc;
          document.getElementById('val-dist').innerText = `${totalDistance.toFixed(2)} km`;
        }

        trackPoints.push(currentLatLng);
        trackPolyline.setLatLngs(trackPoints);

        // Controllo vicinanza bivi durante il ritorno
        checkProximityToBivi(currentLatLng);
      }

      lastLatLng = currentLatLng;
    }

    // Freccia Blu
    function updateArrowMarker(latLng, heading) {
      const svgArrow = `
        <div class="arrow-icon" style="transform: rotate(${heading}deg);">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L2 22L12 18L22 22L12 2Z" fill="#007bff" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
          </svg>
        </div>
      `;

      const customIcon = L.divIcon({
        html: svgArrow,
        className: 'custom-arrow-container',
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      });

      if (!arrowMarker) {
        arrowMarker = L.marker(latLng, { icon: customIcon }).addTo(map);
      } else {
        arrowMarker.setLatLng(latLng);
        arrowMarker.setIcon(customIcon);
      }
    }

    function calculateBearing(lat1, lon1, lat2, lon2) {
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const lat1Rad = lat1 * Math.PI / 180;
      const lat2Rad = lat2 * Math.PI / 180;

      if (Math.abs(lat2 - lat1) < 0.00001 && Math.abs(lon2 - lon1) < 0.00001) return null;

      const y = Math.sin(dLon) * Math.cos(lat2Rad);
      const x = Math.cos(lat1Rad) * Math.sin(lat2Rad) - Math.sin(lat1Rad) * Math.cos(lat2Rad) * Math.cos(dLon);
      let brng = Math.atan2(y, x) * 180 / Math.PI;
      return (brng + 360) % 360;
    }

    // Aggiunta Sosta Manuale
    function addManualStop() {
      if (!lastLatLng) {
        alert("In attesa del segnale GPS...");
        return;
      }
      stopCount++;
      const stopIcon = L.divIcon({
        className: 'stop-marker-icon',
        html: `⏸ ${stopCount}`,
        iconSize: [28, 28],
        iconAnchor: [14, 14]
      });

      L.marker(lastLatLng, { icon: stopIcon })
        .addTo(map)
        .bindPopup(`<b>Sosta #${stopCount}</b><br>Registrata alle ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}`)
        .openPopup();
    }

    // Segnalazione Bivio/Deviazione
    function addBivioMarker() {
      if (!lastLatLng) {
        alert("In attesa del segnale GPS...");
        return;
      }
      bivioCount++;
      const bivioIcon = L.divIcon({
        className: 'bivio-marker-icon',
        html: `🔀 ${bivioCount}`,
        iconSize: [32, 32],
        iconAnchor: [16, 16]
      });

      const marker = L.marker(lastLatLng, { icon: bivioIcon })
        .addTo(map)
        .bindPopup(`<b>Bivio/Deviazione #${bivioCount}</b><br>Punto critico registrato per il ritorno!`)
        .openPopup();

      bivioLocations.push({
        id: bivioCount,
        latLng: lastLatLng,
        notified: false
      });
    }

    // Avviso Prossimità Bivio al Ritorno
    function checkProximityToBivi(currentLatLng) {
      bivioLocations.forEach(bivio => {
        const dist = map.distance(currentLatLng, bivio.latLng);
        if (dist < 25 && !bivio.notified) { // Entro 25 metri
          bivio.notified = true;
          alert(`⚠️ ATTENZIONE BIVIO #${bivio.id} NELLE VICINANZE!\nControlla la mappa per la direzione di ritorno.`);
        } else if (dist > 50) {
          bivio.notified = false; // Reset quando ti allontani per eventuali passaggi successivi
        }
      });
    }

    function onGPSError(error) {
      let msg = "Errore GPS";
      if (error.code === 1) msg = "Permesso GPS negato";
      else if (error.code === 2) msg = "Segnale non disponibile";
      else if (error.code === 3) msg = "Timeout ricerca GPS";
      
      updateGPSStatus(false, msg);
    }

    function updateGPSStatus(active, message) {
      const dot = document.getElementById('gps-dot');
      const text = document.getElementById('gps-text');
      
      if (active) {
        dot.classList.add('active');
      } else {
        dot.classList.remove('active');
      }
      text.innerText = message;
    }

    // Altitudine via API Open-Meteo
    async function fetchAccurateAltitude(lat, lng, fallbackAlt) {
      const now = Date.now();
      if (now - lastAltFetchTime < 10000) return;
      lastAltFetchTime = now;

      try {
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`);
        if (response.ok) {
          const data = await response.json();
          if (data.elevation !== undefined) {
            document.getElementById('val-alt').innerText = `${Math.round(data.elevation)} m`;
            return;
          }
        }
      } catch (e) {
        console.warn("API altitudine offline, uso il dato GPS:", e);
      }

      if (fallbackAlt !== null && !isNaN(fallbackAlt)) {
        document.getElementById('val-alt').innerText = `${Math.round(fallbackAlt)} m`;
      }
    }

    function toggleTracking() {
      const btn = document.getElementById('btn-toggle');
      tracking = !tracking;

      if (tracking) {
        btn.innerText = "Ferma Registrazione";
        btn.className = "btn btn-stop";
      } else {
        btn.innerText = "Avvia Registrazione";
        btn.className = "btn btn-start";
      }
    }

    function reverseTrack() {
      if (trackPoints.length < 2) {
        alert("Nessuna traccia sufficiente da invertire!");
        return;
      }
      trackPoints.reverse();
      trackPolyline.setStyle({ color: '#ff9f1c' }); // Cambia in Arancione
      trackPolyline.setLatLngs(trackPoints);
      alert("Traccia invertita! Ora la vedi in arancione per guidarti nel percorso di ritorno.");
    }

    window.onload = initMap;
  </script>
</body>
</html>
