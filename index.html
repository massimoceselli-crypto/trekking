<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sentierovivo - Trekking GPS</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #121212;
      color: #ffffff;
    }

    #map {
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Dashboard informativa in alto */
    .dashboard {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      width: 92%;
      max-width: 450px;
      background: rgba(20, 20, 20, 0.88);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 12px 16px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .dash-card {
      text-align: center;
    }

    .dash-card .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #aaaaaa;
    }

    .dash-card .value {
      font-size: 1.15rem;
      font-weight: 700;
      color: #2ec4b6;
      margin-top: 2px;
    }

    /* Controlli in basso */
    .controls {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      display: flex;
      gap: 12px;
      width: 92%;
      max-width: 450px;
    }

    .btn {
      flex: 1;
      padding: 14px 10px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }

    .btn-start { background-color: #2ec4b6; color: #011627; }
    .btn-stop { background-color: #e71d36; color: #ffffff; }
    .btn-reverse { background-color: #ff9f1c; color: #011627; }

    /* Indicatori stato GPS */
    .gps-status {
      position: absolute;
      top: 90px;
      right: 16px;
      z-index: 1000;
      background: rgba(0,0,0,0.7);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: #ff0000;
    }

    .dot.active {
      background-color: #2ec4b6;
      box-shadow: 0 0 8px #2ec4b6;
    }
  </style>
</head>
<body>

  <div class="dashboard">
    <div class="dash-card">
      <div class="label">Altitudine</div>
      <div class="value" id="val-alt">--- m</div>
    </div>
    <div class="dash-card">
      <div class="label">Distanza</div>
      <div class="value" id="val-dist">0.0 km</div>
    </div>
    <div class="dash-card">
      <div class="label">Velocità</div>
      <div class="value" id="val-speed">0.0 km/h</div>
    </div>
  </div>

  <div class="gps-status">
    <div class="dot" id="gps-dot"></div>
    <span id="gps-text">GPS: In attesa...</span>
  </div>

  <div id="map"></div>

  <div class="controls">
    <button class="btn btn-start" id="btn-toggle" onclick="toggleTracking()">Avvia Registrazione</button>
    <button class="btn btn-reverse" onclick="reverseTrack()">Inverti Traccia</button>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    let map, userMarker, trackPolyline;
    let tracking = false;
    let trackPoints = [];
    let totalDistance = 0; // in km
    let watchId = null;
    let lastAltFetchTime = 0;

    // Inizializzazione Mappa
    function initMap() {
      map = L.map('map', { zoomControl: false }).setView([43.548, 10.310], 13);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }).addTo(map);

      trackPolyline = L.polyline([], { color: '#ff9f1c', weight: 4 }).addTo(map);

      // Inizia monitoraggio posizione GPS
      startGPS();
    }

    // Monitoraggio GPS con gestione errori corretta
    function startGPS() {
      if (!navigator.geolocation) {
        updateGPSStatus(false, "GPS non supportato");
        return;
      }

      watchId = navigator.geolocation.watchPosition(
        onGPSSuccess,
        onGPSError,
        {
          enableHighAccuracy: true,
          timeout: 15000,
          maximumAge: 3000
        }
      );
    }

    function onGPSSuccess(position) {
      const lat = position.coords.latitude;
      const lng = position.coords.longitude;
      const speed = position.coords.speed ? (position.coords.speed * 3.6).toFixed(1) : "0.0";
      
      updateGPSStatus(true, "GPS Attivo");
      document.getElementById('val-speed').innerText = `${speed} km/h`;

      const currentLatLng = [lat, lng];

      // Aggiorna o crea il marker utente
      if (!userMarker) {
        userMarker = L.circleMarker(currentLatLng, {
          radius: 8,
          fillColor: '#2ec4b6',
          color: '#ffffff',
          weight: 2,
          fillOpacity: 1
        }).addTo(map);
        map.setView(currentLatLng, 16);
      } else {
        userMarker.setLatLng(currentLatLng);
      }

      // Recupera altitudine accurata via API (con throttling di 10 secondi)
      fetchAccurateAltitude(lat, lng, position.coords.altitude);

      // Se il tracciamento è attivo, registra il punto
      if (tracking) {
        if (trackPoints.length > 0) {
          const lastPoint = trackPoints[trackPoints.length - 1];
          const distInc = map.distance(lastPoint, currentLatLng) / 1000; // in km
          totalDistance += distInc;
          document.getElementById('val-dist').innerText = `${totalDistance.toFixed(2)} km`;
        }
        trackPoints.push(currentLatLng);
        trackPolyline.setLatLngs(trackPoints);
      }
    }

    function onGPSError(error) {
      let msg = "Errore GPS";
      if (error.code === 1) msg = "Permesso GPS negato";
      else if (error.code === 2) msg = "Segnale GPS non disponibile";
      else if (error.code === 3) msg = "Timeout ricerca GPS";
      
      updateGPSStatus(false, msg);
    }

    function updateGPSStatus(active, message) {
      const dot = document.getElementById('gps-dot');
      const text = document.getElementById('gps-text');
      
      if (active) {
        dot.classList.add('active');
      } else {
        dot.classList.remove('active');
      }
      text.innerText = message;
    }

    // Recupero altitudine esatta tramite API Open-Meteo Elevation
    async function fetchAccurateAltitude(lat, lng, fallbackAlt) {
      const now = Date.now();
      if (now - lastAltFetchTime < 10000) return; // limita le richieste a 1 ogni 10 sec
      lastAltFetchTime = now;

      try {
        const response = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&current_weather=true`);
        if (response.ok) {
          const data = await response.json();
          if (data.elevation !== undefined) {
            document.getElementById('val-alt').innerText = `${Math.round(data.elevation)} m`;
            return;
          }
        }
      } catch (e) {
        console.warn("Impossibile recuperare altitudine via API, uso il dato GPS:", e);
      }

      // Fallback su dato GPS nativo se presente
      if (fallbackAlt !== null && !isNaN(fallbackAlt)) {
        document.getElementById('val-alt').innerText = `${Math.round(fallbackAlt)} m`;
      }
    }

    // Gestione Avvio / Arresto Registrazione
    function toggleTracking() {
      const btn = document.getElementById('btn-toggle');
      tracking = !tracking;

      if (tracking) {
        btn.innerText = "Ferma Registrazione";
        btn.className = "btn btn-stop";
      } else {
        btn.innerText = "Avvia Registrazione";
        btn.className = "btn btn-start";    
      }
    }

    // Inversione Traccia registrata
    function reverseTrack() {
      if (trackPoints.length < 2) {
        alert("Nessuna traccia sufficiente da invertire!");
        return;
      }
      trackPoints.reverse();
      trackPolyline.setLatLngs(trackPoints);
      alert("Traccia invertita! Ora puoi seguirla a ritroso.");
    }

    window.onload = initMap;
  </script>
</body>
</html>
