<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SentieroVivo - GPS Tracker</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: 'Inter', sans-serif; background: #121212; color: #fff; overflow: hidden; }
        #map { height: 100vh; width: 100vw; z-index: 1; }

        /* Status bar superiore */
        #gps-status {
            position: fixed;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #ffaa00; animation: pulse 1.5s infinite; }
        .dot.active { background: #2ecc71; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

        /* Pannello comandi fluttuante */
        .panel {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            max-width: 400px;
            margin: 0 auto;
            z-index: 1000;
            background: rgba(25, 25, 25, 0.9);
            backdrop-filter: blur(16px);
            padding: 18px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .stat-value { font-size: 15px; font-weight: 700; color: #fff; display: block; margin-top: 2px; }
        .stat-label { color: #aaa; font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }

        .btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .btn-full { grid-column: span 2; }
        
        button, .file-label {
            padding: 12px;
            cursor: pointer;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            transition: all 0.2s ease;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        button:active { transform: scale(0.97); }

        #btnStart { background: #2ecc71; color: white; grid-column: span 2; }
        #btnStop { background: #e74c3c; color: white; grid-column: span 2; display: none; }
        .btn-bivio { background: rgba(231, 76, 60, 0.2); color: #ff6b6b; border: 1px solid rgba(231, 76, 60, 0.4); }
        .btn-sosta { background: rgba(241, 196, 15, 0.2); color: #f1c40f; border: 1px solid rgba(241, 196, 15, 0.4); }
        .btn-clear { background: rgba(255, 255, 255, 0.08); color: #ccc; }
        .btn-load { background: rgba(52, 152, 219, 0.2); color: #3498db; border: 1px solid rgba(52, 152, 219, 0.4); }
        .btn-save { background: #3498db; color: white; }

        .del-btn { background: #e74c3c; color: white; border: none; padding: 6px 10px; width: 100%; border-radius: 6px; cursor: pointer; margin-top: 8px; font-size: 11px; }
        input[type="file"] { display: none; }
    </style>
</head>
<body>

    <div id="gps-status">
        <div id="statusDot" class="dot"></div>
        <span id="statusText">Ricerca segnale GPS...</span>
    </div>

    <div class="panel">
        <div class="stats-grid">
            <div class="stat-card">
                <span class="stat-label">Altitudine</span>
                <span class="stat-value"><span id="altNow">---</span>m</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Max Quota</span>
                <span class="stat-value"><span id="altMax">---</span>m</span>
            </div>
            <div class="stat-card">
                <span class="stat-label">Distanza</span>
                <span class="stat-value"><span id="dist">0.00</span>km</span>
            </div>
        </div>

        <div class="btn-group">
            <button id="btnStart" onclick="startRecording()">▶ Avvia Tracciamento</button>
            <button id="btnStop" onclick="stopAndSave()">⏹ Termina e Salva</button>
            
            <button class="btn-bivio" onclick="dropFlag('Bivio', '#e74c3c')">📍 Segna Bivio</button>
            <button class="btn-sosta" onclick="dropFlag('Sosta', '#f1c40f')">⛺ Segna Sosta</button>
            
            <label for="fileInput" class="file-label btn-load">📁 Carica JSON</label>
            <input type="file" id="fileInput" accept=".json" onchange="loadOldPath(event)">
            
            <button class="btn-clear" onclick="clearAllFlags()">🗑 Pulisci Note</button>
        </div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map', { zoomControl: false }).setView([41.87, 12.56], 13);
        L.control.zoom({ position: 'topright' }).addTo(map);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let recordedPath = [];
        let flagsMarkers = [];
        let currentPolyline = L.polyline([], { color: '#3498db', weight: 5, opacity: 0.8 }).addTo(map);
        let userMarker = null;
        let isRecording = false;
        let totalDist = 0;
        let maxAlt = -Infinity;
        let currentPos = null;

        // Gestione GPS robusta e senza blocchi
        if ("geolocation" in navigator) {
            navigator.geolocation.watchPosition(
                (pos) => {
                    const { latitude: lat, longitude: lng, altitude: alt } = pos.coords;
                    currentPos = { lat, lng, alt };

                    // Aggiorna stato UI GPS
                    document.getElementById('statusDot').classList.add('active');
                    document.getElementById('statusText').innerText = `GPS Attivo (${lat.toFixed(4)}, ${lng.toFixed(4)})`;

                    if (alt !== null && !isNaN(alt)) {
                        const rAlt = Math.round(alt);
                        document.getElementById('altNow').innerText = rAlt;
                        if (rAlt > maxAlt) {
                            maxAlt = rAlt;
                            document.getElementById('altMax').innerText = maxAlt;
                        }
                    }

                    if (!userMarker) {
                        userMarker = L.circleMarker([lat, lng], {
                            radius: 8,
                            fillColor: "#3498db",
                            color: "#fff",
                            weight: 2,
                            fillOpacity: 1
                        }).addTo(map);
                        map.setView([lat, lng], 17);
                    } else {
                        userMarker.setLatLng([lat, lng]);
                    }

                    if (isRecording) {
                        if (recordedPath.length > 0) {
                            const last = recordedPath[recordedPath.length - 1];
                            const d = L.latLng(last[0], last[1]).distanceTo(L.latLng(lat, lng));
                            if (d > 3) { // Registra se ci si sposta di almeno 3 metri
                                totalDist += d;
                                recordedPath.push([lat, lng, alt]);
                                currentPolyline.setLatLngs(recordedPath);
                                document.getElementById('dist').innerText = (totalDist / 1000).toFixed(2);
                            }
                        } else {
                            recordedPath.push([lat, lng, alt]);
                        }
                    }
                },
                (err) => {
                    console.warn("Errore GPS:", err.message);
                    document.getElementById('statusDot').classList.remove('active');
                    document.getElementById('statusText').innerText = "Segnale GPS debole o assente";
                },
                { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 }
            );
        } else {
            document.getElementById('statusText').innerText = "Geolocalizzazione non supportata";
        }

        function dropFlag(tipo, colore, loadedNote = null, lat = null, lng = null) {
            if (!currentPos && !lat) {
                alert("Posizione GPS non ancora acquisita.");
                return;
            }
            const fLat = lat || currentPos.lat;
            const fLng = lng || currentPos.lng;
            let nota = loadedNote || prompt(`Aggiungi una nota per ${tipo}:`, tipo);
            if (nota === null) return;

            const iconHtml = `<div style="background-color:${colore}; width:14px; height:14px; border-radius:50%; border:2px solid white; box-shadow: 0 2px 8px rgba(0,0,0,0.4);"></div>`;
            const customIcon = L.divIcon({ html: iconHtml, className: '', iconSize: [14, 14], iconAnchor: [7, 7] });

            const marker = L.marker([fLat, fLng], { icon: customIcon }).addTo(map);
            
            const div = document.createElement('div');
            div.innerHTML = `<b style="color:#111;">${tipo}</b><br><span style="color:#446;">${nota}</span>`;
            const delBtn = document.createElement('button');
            delBtn.innerText = "Rimuovi indicatore";
            delBtn.className = "del-btn";
            delBtn.onclick = () => { map.removeLayer(marker); flagsMarkers = flagsMarkers.filter(m => m !== marker); };
            div.appendChild(delBtn);

            marker.bindPopup(div);
            marker.tipoDato = { tipo, nota, colore };
            flagsMarkers.push(marker);
        }

        function clearAllFlags() {
            if(confirm("Vuoi rimuovere tutti i punti di sosta/bivio?")) {
                flagsMarkers.forEach(m => map.removeLayer(m));
                flagsMarkers = [];
            }
        }

        function startRecording() {
            isRecording = true;
            recordedPath = [];
            flagsMarkers.forEach(m => map.removeLayer(m));
            flagsMarkers = [];
            totalDist = 0;
            maxAlt = -Infinity;
            currentPolyline.setLatLngs([]);
            document.getElementById('btnStart').style.display = 'none';
            document.getElementById('btnStop').style.display = 'block';
        }

        function stopAndSave() {
            isRecording = false;
            document.getElementById('btnStart').style.display = 'block';
            document.getElementById('btnStop').style.display = 'none';

            const nomeFile = prompt("Inserisci il nome per salvare il percorso:", "Trekking_" + new Date().toISOString().slice(0,10));
            if (!nomeFile) return;

            const data = {
                nome: nomeFile,
                distanza: document.getElementById('dist').innerText,
                maxAlt: maxAlt === -Infinity ? 0 : maxAlt,
                percorso: recordedPath,
                bandierine: flagsMarkers.map(m => ({ lat: m.getLatLng().lat, lng: m.getLatLng().lng, info: m.tipoDato }))
            };

            const blob = new Blob([JSON.stringify(data, null, 2)], {type: "application/json"});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = nomeFile + ".json";
            a.click();
        }

        function loadOldPath(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                try {
                    const d = JSON.parse(e.target.result);
                    if (d.percorso && d.percorso.length > 0) {
                        L.polyline(d.percorso, { color: '#e67e22', weight: 4, dashArray: '6,6' }).addTo(map);
                        if (d.bandierine) {
                            d.bandierine.forEach(f => dropFlag(f.info.tipo, f.info.colore, f.info.nota, f.lat, f.lng));
                        }
                        map.fitBounds(L.polyline(d.percorso).getBounds());
                    }
                } catch (err) {
                    alert("Errore nella lettura del file JSON.");
                }
            };
            reader.readAsText(file);
        }
    </script>
</body>
</html>
