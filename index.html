<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SENTIEROVIVO - GPS</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; height: 100%; background: #111; font-family: sans-serif; color: white; overflow: hidden; }
        
        /* Area Mappa - 78% dell'altezza schermo */
        #map { height: 78vh; width: 100%; background: #222; }
        
        /* Pannello Controlli - 22% dell'altezza per evitare lo scroll */
        .controls { 
            height: 22vh; 
            display: grid; 
            grid-template-columns: repeat(3, 1fr); 
            gap: 4px; 
            padding: 4px; 
            background: #1f2937; 
        }
        
        /* Pulsanti super-compatti per restare dentro lo schermo */
        button, label.btn-file { 
            border: none; 
            border-radius: 6px; 
            color: white; 
            font-weight: bold; 
            font-size: 13px; 
            text-transform: uppercase; 
            cursor: pointer;
            display: flex; 
            align-items: center; 
            justify-content: center; 
            text-align: center;
            padding: 2px;
            margin: 0;
            line-height: 1;
        }
        button:active, label.btn-file:active { opacity: 0.8; }
        
        .btn-start { background: #10b981; grid-column: span 3; font-size: 15px; font-weight: 900; }
        .btn-photo { background: #f97316; }
        .btn-pause { background: #ea580c; }
        .btn-reverse { background: #2563eb; }
        .btn-file { background: #9333ea; }
        .btn-save { background: #eab308; color: #000; }
        .btn-reset { background: #4b5563; }
        
        .recording { background: #dc2626 !important; }
        
        #status { 
            position: absolute; 
            top: 8px; 
            left: 8px; 
            z-index: 1000; 
            background: rgba(0,0,0,0.85); 
            padding: 4px 10px; 
            border-radius: 12px; 
            font-size: 11px; 
            border: 1px solid #10b981; 
            font-weight: bold; 
        }
        
        /* FRECCIA PULITA SENZA SFONDO E SENZA RIQUADRO */
        .clean-arrow-marker {
            background: none !important;
            border: none !important;
        }
        #arrowIcon { 
            font-size: 32px; 
            line-height: 32px;
            text-align: center;
            display: block;
            transition: transform 0.2s ease;
        }
    </style>
</head>
<body>

    <div id="status">Ricerca GPS...</div>
    <div id="map"></div>

    <div class="controls">
        <button id="startBtn" class="btn-start">▶ Inizia Percorso</button>
        
        <button id="photoBtn" class="btn-photo">📷 Foto</button>
        <button id="pauseBtn" class="btn-pause">🚩 Sosta</button>
        <button id="reverseBtn" class="btn-reverse">🔄 A Ritroso</button>
        
        <label class="btn-file">
            📂 Carica
            <input type="file" id="loadFile" hidden accept=".gpx,.json">
        </label>
        <button id="saveBtn" class="btn-save">💾 Salva</button>
        <button id="resetBtn" class="btn-reset">🗑️ Reset</button>

        <input type="file" id="cameraInput" accept="image/*" capture="environment" hidden>
    </div>

    <script>
        let map, pathLine, userMarker, coords = [], watchId = null;
        let isPaused = false, isReversed = false;
        let lastVoiceWarning = 0;
        let photoCounter = 1;
        let photoBaseName = "";
        let currentPos = null;

        // Inizializzazione Mappa
        map = L.map('map', { zoomControl: true, tap: false }).setView([43.6, 11.3], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

        // Marker Freccia Libera
        const arrowIcon = L.divIcon({
            html: `<div id="arrowIcon">⬆️</div>`,
            className: 'clean-arrow-marker',
            iconSize: [32, 32],
            iconAnchor: [16, 16]
        });

        userMarker = L.marker([0,0], {icon: arrowIcon}).addTo(map);
        pathLine = L.polyline([], {color: '#10b981', weight: 6, opacity: 0.9}).addTo(map);

        function speak(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(text);
                u.lang = 'it-IT';
                window.speechSynthesis.speak(u);
            }
        }

        function getDistanceMeters(lat1, lon1, lat2, lon2) {
            const R = 6371000;
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function getMinDistanceToTrack(pos) {
            if (coords.length === 0) return 0;
            let minD = Infinity;
            coords.forEach(p => {
                const d = getDistanceMeters(pos[0], pos[1], p[0], p[1]);
                if (d < minD) minD = d;
            });
            return minD;
        }

        function updatePos(position) {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            currentPos = [lat, lng];

            // Calcolo orientamento freccia
            if (coords.length > 0) {
                const last = coords[coords.length - 1];
                let angle = Math.atan2(lng - last[1], lat - last[0]) * 180 / Math.PI;
                if (isReversed) angle += 180;
                const el = document.getElementById('arrowIcon');
                if (el) el.style.transform = `rotate(${angle}deg)`;
            }

            userMarker.setLatLng(currentPos);
            document.getElementById('status').innerText = `🟢 GPS OK | Punti: ${coords.length}`;

            if (watchId !== null && !isPaused && !isReversed) {
                coords.push(currentPos);
                pathLine.setLatLngs(coords);
                map.panTo(currentPos);
            }

            if (isReversed && coords.length > 1) {
                const minD = getMinDistanceToTrack(currentPos);
                const now = Date.now();

                if (minD > 25 && (now - lastVoiceWarning > 15000)) {
                    speak(`Attenzione! Sei fuori percorso di ${Math.round(minD)} metri.`);
                    lastVoiceWarning = now;
                }

                const distToStart = getDistanceMeters(lat, lng, coords[0][0], coords[0][1]);
                if (distToStart < 15 && (now - lastVoiceWarning > 30000)) {
                    speak("Sei arrivato a destinazione al punto di partenza!");
                    lastVoiceWarning = now;
                }
            }
        }

        function handleGpsError(err) {
            document.getElementById('status').innerText = "🔴 Attiva il GPS sul telefono";
        }

        // FOTO
        document.getElementById('photoBtn').onclick = function() {
            if (!currentPos) return alert("Attendi la posizione GPS.");
            if (photoBaseName === "") {
                let name = prompt("Nome base per le foto dell'escursione:", "Trekking");
                if (!name) return;
                photoBaseName = name.replace(/[^a-zA-Z0-9_-]/g, "_");
            }
            document.getElementById('cameraInput').click();
        };

        document.getElementById('cameraInput').onchange = function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const fileName = `${photoBaseName}_${photoCounter}.jpg`;

            const downloadLink = document.createElement('a');
            downloadLink.href = URL.createObjectURL(file);
            downloadLink.download = fileName;
            downloadLink.click();

            const photoUrl = URL.createObjectURL(file);
            const photoMarker = L.marker([currentPos[0], currentPos[1]], {
                icon: L.divIcon({html: '📸', iconSize: [28, 28], className: 'clean-arrow-marker'})
            }).addTo(map);

            photoMarker.bindPopup(`
                <div style="text-align:center; color:#000;">
                    <b>${fileName}</b><br>
                    <img src="${photoUrl}" style="width:140px; height:auto; border-radius:6px; margin-top:5px;">
                </div>
            `);

            speak(`Foto ${photoCounter} salvata.`);
            photoCounter++;
        };

        // CONTROLLI
        document.getElementById('startBtn').onclick = function() {
            if (watchId === null) {
                coords = []; pathLine.setLatLngs([]);
                photoCounter = 1; photoBaseName = "";
                
                watchId = navigator.geolocation.watchPosition(updatePos, handleGpsError, {
                    enableHighAccuracy: true,
                    maximumAge: 0,
                    timeout: 10000
                });
                
                this.innerText = "⏹ Concludi";
                this.classList.add('recording');
                speak("SENTIEROVIVO: Registrazione avviata.");
            } else {
                navigator.geolocation.clearWatch(watchId);
                watchId = null;
                this.innerText = "▶ Inizia Percorso";
                this.classList.remove('recording');
                speak("Percorso concluso e salvato.");
                saveGPX();
            }
        };

        document.getElementById('pauseBtn').onclick = function() {
            isPaused = !isPaused;
            this.style.background = isPaused ? "#4b5563" : "#ea580c";
            if (isPaused) {
                if (currentPos) L.marker(currentPos, {icon: L.divIcon({html:'🚩', iconSize:[25,25], className:'clean-arrow-marker'})}).addTo(map);
                speak("Sosta attivata.");
            } else {
                speak("Ripresa del percorso.");
            }
        };

        document.getElementById('reverseBtn').onclick = function() {
            if (coords.length < 2) return alert("Registra o carica un percorso per invertire.");
            isReversed = !isReversed;
            this.style.background = isReversed ? "#dc2626" : "#2563eb";
            if (isReversed) {
                speak("Modalità a ritroso attivata.");
            } else {
                speak("Modalità normale ripristinata.");
            }
        };

        function saveGPX() {
            if (coords.length < 2) return;
            let gpx = `<?xml version="1.0" encoding="UTF-8"?>\n<gpx version="1.1" creator="SENTIEROVIVO" xmlns="http://www.topografix.com/GPX/1/1">\n  <trk><name>SENTIEROVIVO</name><trkseg>\n`;
            coords.forEach(p => { gpx += `    <trkpt lat="${p[0]}" lon="${p[1]}"></trkpt>\n`; });
            gpx += `  </trkseg></trk>\n</gpx>`;
            
            const blob = new Blob([gpx], {type: "application/gpx+xml"});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `SENTIEROVIVO_${new Date().toISOString().slice(0,10)}.gpx`;
            a.click();
        }
        document.getElementById('saveBtn').onclick = saveGPX;

        document.getElementById('loadFile').onchange = function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(event) {
                const text = event.target.result;
                coords = [];
                try {
                    if (text.includes('<gpx')) {
                        const xml = new DOMParser().parseFromString(text, "text/xml");
                        const pts = xml.getElementsByTagName("trkpt");
                        for (let i = 0; i < pts.length; i++) {
                            coords.push([parseFloat(pts[i].getAttribute("lat")), parseFloat(pts[i].getAttribute("lon"))]);
                        }
                    } else {
                        coords = JSON.parse(text);
                    }

                    if (coords.length > 0) {
                        pathLine.setLatLngs(coords);
                        map.fitBounds(pathLine.getBounds());
                        speak("Percorso caricato sulla mappa.");
                    } else {
                        alert("File senza dati GPS validi.");
                    }
                } catch (err) {
                    alert("Errore nel caricamento.");
                }
            };
            reader.readAsText(file);
        };

        document.getElementById('resetBtn').onclick = function() {
            if (confirm("Reset completo del percorso?")) location.reload();
        };

        navigator.geolocation.getCurrentPosition(updatePos, handleGpsError, { enableHighAccuracy: true });
    </script>
</body>
</html>
